[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-monitor"
version = "0.1.0"
description = "A file integrity monitoring tool"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["fim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
[tool.ruff]
target-version = ""py39""
line-length = 100

[tool.ruff.lint]
select = [""E"", ""F"", ""W"", ""I"", ""N"", ""UP"", ""B"", ""C4"", ""SIM""]
ignore = [""E501""]

[tool.ruff.lint.pydocstyle]
convention = ""google""
